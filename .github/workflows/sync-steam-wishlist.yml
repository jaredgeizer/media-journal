name: Sync Steam Wishlists

# Calls the sync-steam-wishlist Edge Function once a day, which loops
# every connected Steam account (supabase/functions/sync-steam-wishlist)
# and adds any newly wishlisted games straight into Backlog — this is what
# makes the sync automatic with no action needed in the app. See the
# "Setting up Steam wishlist sync" section in README.md for how to deploy
# the function and set the two secrets this workflow needs:
#   - STEAM_SYNC_URL: the deployed function's URL
#     (https://<project-ref>.supabase.co/functions/v1/sync-steam-wishlist)
#   - STEAM_SYNC_CRON_SECRET: must match the CRON_SECRET secret set on
#     the function itself (`supabase secrets set CRON_SECRET=...`) —
#     unlike the anon key in js/config.js, this one has to stay private,
#     since it's what lets this workflow write to every connected user's
#     Backlog.

on:
  schedule:
    - cron: '0 13 * * *' # daily, 13:00 UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-steam-wishlist
        env:
          STEAM_SYNC_URL: ${{ secrets.STEAM_SYNC_URL }}
          STEAM_SYNC_CRON_SECRET: ${{ secrets.STEAM_SYNC_CRON_SECRET }}
        run: |
          if [ -z "$STEAM_SYNC_URL" ] || [ -z "$STEAM_SYNC_CRON_SECRET" ]; then
            echo "STEAM_SYNC_URL and/or STEAM_SYNC_CRON_SECRET repository secrets aren't set — see README.md's Steam wishlist sync setup section." >&2
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$STEAM_SYNC_URL" \
            -H "x-cron-secret: $STEAM_SYNC_CRON_SECRET")
          echo "Response (HTTP $status):"
          cat response.json
          if [ "$status" -ge 400 ]; then
            echo "sync-steam-wishlist returned an error status" >&2
            exit 1
          fi
